<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ymmo — Modifier un bien</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .edit-wrap { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .edit-card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .edit-card h2 { font-size: 20px; margin-bottom: 24px; color: #1a1a2e; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 13px; color: #555; }
        input, select, textarea { padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        .btn-save { padding: 12px 28px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-save:hover { background: #2d2d4e; }
        .btn-cancel { padding: 12px 20px; background: #f0f0f0; color: #333; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px; text-decoration: none; }
        .btns { display: flex; gap: 10px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="admin-header" style="background:#1a1a2e;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center">
        <h1 style="font-size:20px;margin:0">Ymmo — Modifier un bien</h1>
        <a href="/admin" style="color:#aaa;text-decoration:none;font-size:13px">← Retour au panel</a>
    </div>
    <div class="edit-wrap">
        <div class="edit-card">
            <h2>Bien #{{ bien.id }} — {{ bien.titre }}</h2>
            <form method="POST">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Titre</label>
                        <input type="text" name="titre" value="{{ bien.titre }}" required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select name="type">
                            {% for t in ['appartement','maison','bureau','commerce','terrain'] %}
                            <option value="{{ t }}" {% if bien.type == t %}selected{% endif %}>{{ t|capitalize }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Statut</label>
                        <select name="statut">
                            {% for s in ['disponible','vendu','loue','archive'] %}
                            <option value="{{ s }}" {% if bien.statut == s %}selected{% endif %}>{{ s|capitalize }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Prix (€)</label>
                        <input type="number" name="prix" value="{{ bien.prix }}" required>
                    </div>
                    <div class="form-group">
                        <label>Surface (m²)</label>
                        <input type="number" name="surface" value="{{ bien.surface or '' }}">
                    </div>
                    <div class="form-group">
                        <label>Ville</label>
                        <input type="text" name="ville" value="{{ bien.ville }}">
                    </div>
                    <div class="form-group">
                        <label>Nb pièces</label>
                        <input type="number" name="nb_pieces" value="{{ bien.nb_pieces or '' }}">
                    </div>
                    <div class="form-group full">
                        <label>Adresse</label>
                        <input type="text" name="adresse" value="{{ bien.adresse or '' }}">
                    </div>
                    <div class="form-group full">
                        <label>Description</label>
                        <textarea name="description">{{ bien.description or '' }}</textarea>
                    </div>
                </div>
                <div class="btns">
                    <button type="submit" class="btn-save">Enregistrer</button>
                    <a href="/admin" class="btn-cancel">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
