<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ymmo — Créer un compte</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrap { max-width: 400px; margin: 80px auto; padding: 0 20px; }
        .login-card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .login-card h2 { font-size: 22px; margin-bottom: 24px; color: #1a1a2e; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px; }
        .btn-login:hover { background: #2d2d4e; }
        .error { color: #c0392b; font-size: 13px; margin-bottom: 12px; }
        .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #888; text-decoration: none; }
        .hint { font-size: 11px; color: #aaa; margin-top: 4px; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>Ymmo</h1>
            <p>Espace compte</p>
        </div>
    </header>
    <div class="login-wrap">
        <div class="login-card">
            <h2>Créer un compte</h2>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <p class="error">{{ messages[0] }}</p>
                {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" name="nom" placeholder="Dupont" required>
                </div>
                <div class="form-group">
                    <label>Prénom</label>
                    <input type="text" name="prenom" placeholder="Jean" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="jean.dupont@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="tel" name="telephone" placeholder="0612345678">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="password" required minlength="8">
                    <p class="hint">8 caractères minimum</p>
                </div>
                <div class="form-group">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" name="password_confirm" required>
                </div>
                <button type="submit" class="btn-login">Créer mon compte</button>
            </form>
            <a href="/login" class="back">Déjà un compte ? Se connecter</a>
        </div>
    </div>
</body>
</html>
